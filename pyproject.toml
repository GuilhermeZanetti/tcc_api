[tool.poetry]
name = "judge"
version = "0.1.0"
description = "Judge API"
authors = ["Caio Santoro <csantbr@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" },
    { include = "migrations" }
]

[tool.poetry.dependencies]
python = ">=3.12"
blue = ">=0.9.1"
fastapi = ">=0.115.6"
hypercorn = ">=0.17.3"
mongodb-migrations = "1.3.0"
motor = "3.4.0"
passlib = ">=1.7.4"
pydantic-settings = ">=2.7.0"
pymongo = "4.6.3"
python-dotenv = ">=1.0.1"
redis = ">=5.0.1"
rq = ">=1.15.1"
pyjwt = "^2.10.1"
pytest = "^8.4.1"
httpx = "^0.28.1"
pytest-asyncio = "^1.1.0"
bcrypt = "^4.3.0"
ruff = "^0.12.10"
sqlalchemy = "^2.0.43"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
